---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "prometheus_alertmanager_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: (Deprecation) Catch and report renamed variables for Traefik labels
  ansible.builtin.fail:
    msg: |-
      Your configuration contains a variable, which now has a different name.
      Please rename all `prometheus_alertmanager_container_labels_traefik_*` variables to `prometheus_alertmanager_container_labels_metrics_*` on your configuration file (vars.yml).

      The following variables in your configuration need to be renamed: {{ lookup('ansible.builtin.varnames', '^prometheus_alertmanager_container_labels_traefik_.+', wantlist=True) | join(', ') }}
  when: "lookup('ansible.builtin.varnames', '^prometheus_alertmanager_container_labels_traefik_.+', wantlist=True) | length > 0"

- name: Fail if required Prometheus Alertmanager settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - prometheus_alertmanager_uid
    - prometheus_alertmanager_gid
    - prometheus_alertmanager_container_network

# Alertmanager validates its configuration file at startup and exits when it
# does not hold up, before it ever binds its web listener. With `Restart=always`
# on the systemd unit, that turns into a container which restarts forever while
# the Ansible run that produced it reported success. These two checks catch the
# mistakes that the role's own defaults invite, at the point where the operator
# can still see them.
#
# The final configuration is inspected, rather than
# `prometheus_alertmanager_config_route` and
# `prometheus_alertmanager_config_receivers`, so that a route or a receiver
# introduced through `prometheus_alertmanager_configuration_extension_yaml` (or
# by replacing `prometheus_alertmanager_configuration_yaml` wholesale) counts
# just as much.
- name: Fail if the Prometheus Alertmanager root route has no receiver
  ansible.builtin.fail:
    msg: >-
      Alertmanager's root route must name a receiver ("root route must specify a default receiver"),
      but the configuration this role would write does not have one.
      Define `prometheus_alertmanager_config_route` (a mapping with at least a `receiver` key)
      and `prometheus_alertmanager_config_receivers` (a list with a receiver of that name).
  when: "prometheus_alertmanager_configuration.route.receiver | default('') | string | length == 0"

- name: Fail if the Prometheus Alertmanager root route names an unknown receiver
  ansible.builtin.fail:
    msg: >-
      Alertmanager's root route is routed to a receiver (`{{ prometheus_alertmanager_configuration.route.receiver }}`)
      which is not among the configured receivers
      ({{ prometheus_alertmanager_configuration.receivers | default([]) | selectattr('name', 'defined') | map(attribute='name') | list | join(', ') | default('none', true) }}).
      Add it to `prometheus_alertmanager_config_receivers`.
  when: >-
    prometheus_alertmanager_configuration.route.receiver | default('') | string | length > 0
    and prometheus_alertmanager_configuration.route.receiver not in (
      prometheus_alertmanager_configuration.receivers | default([]) | selectattr('name', 'defined') | map(attribute='name') | list
    )

- name: Run if Traefik is enabled
  when: prometheus_alertmanager_container_labels_metrics_enabled | bool
  block:
    - name: Fail if Traefik settings required for Prometheus Alertmanager are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "prometheus_alertmanager_container_labels_metrics_hostname", when: true }
        - { "name": "prometheus_alertmanager_container_labels_metrics_path_prefix", when: true }
        - { "name": "prometheus_alertmanager_container_labels_metrics_middleware_basic_auth_users", when: "{{ prometheus_alertmanager_container_labels_metrics_middleware_basic_auth_enabled }}" }
